<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9edc9">
  <meta name="description" content="p5.js 程式設計簡易指令練習測驗">
  <title>p5.js 簡易指令練習測驗</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e9edc9'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%23dabfff'/%3E%3Cpath d='M20 31h24M32 19v25' stroke='%23386641' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Isometra&family=LXGW+WenKai+Mono+TC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      font-family: 'LXGW WenKai Mono TC', 'Isometra', sans-serif;
      background: #e9edc9;
    }
    html, body {
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #e9edc9;
    }
    body {
      position: relative;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, canvas {
      font-family: 'LXGW WenKai Mono TC', 'Isometra', sans-serif;
    }
    canvas {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      touch-action: none;
    }
    #boot-status {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 50%;
      z-index: 2147483647;
      display: block !important;
      visibility: visible !important;
      box-sizing: border-box;
      width: min(94vw, 760px);
      transform: translateX(-50%);
      margin: 0;
      padding: 8px 14px;
      border: 1px solid rgba(36, 59, 83, 0.3);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.94);
      color: #243b53;
      box-shadow: 0 3px 14px rgba(36, 59, 83, 0.18);
      font-family: 'LXGW WenKai Mono TC', 'Isometra', sans-serif;
      font-size: clamp(12px, 1.8vw, 16px);
      line-height: 1.35;
      text-align: center;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      pointer-events: none;
    }
    #boot-status[data-state="success"] {
      width: auto;
      max-width: 88vw;
      padding: 4px 10px;
      border-color: rgba(56, 102, 65, 0.32);
      background: rgba(255, 255, 255, 0.72);
      color: #386641;
      font-size: 12px;
    }
    #boot-status[data-state="error"] {
      border-color: #b42318;
      background: rgba(255, 247, 245, 0.98);
      color: #8f1d14;
    }
    @media (max-width: 480px) {
      #boot-status { top: max(6px, env(safe-area-inset-top)); padding: 7px 10px; }
    }
  </style>
  <script>
    (function () {
      function getPanel() { return document.getElementById("boot-status"); }
      window.__setBootStatus = function (message, state) {
        var panel = getPanel();
        if (!panel) return;
        panel.textContent = String(message || "");
        panel.dataset.state = state || "info";
      };
      window.__bootErrorShown = false;
      window.addEventListener("error", function (event) {
        var target = event && event.target;
        var message = event && event.message;
        if (target && target.tagName === "SCRIPT") {
          window.__bootErrorShown = true;
          window.__setBootStatus("程式載入失敗：" + (target.src || "找不到 script") + "。請確認網路，並確認 p5.js 在 sketch.js 之前載入。", "error");
          return;
        }
        if (message) {
          window.__bootErrorShown = true;
          window.__setBootStatus("JavaScript 錯誤：" + message, "error");
        }
      }, true);
      window.addEventListener("unhandledrejection", function (event) {
        var reason = event && event.reason;
        var message = reason && reason.message ? reason.message : String(reason || "未處理的 Promise 錯誤");
        window.__bootErrorShown = true;
        window.__setBootStatus("未處理的非同步錯誤：" + message, "error");
      });
      window.setTimeout(function () {
        if (!window.p5 && !window.__bootErrorShown) {
          window.__setBootStatus("仍在等待 p5.js 載入；請確認網路或改用 p5.js Web Editor。", "error");
        }
      }, 8000);
    }());
  </script>
</head>
<body>
  <div id="boot-status" role="status" aria-live="polite" data-state="info">網頁已載入，正在啟動測驗…</div>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js" crossorigin="anonymous"></script>
  <script src="sketch.js"></script>
</body>
</html>
